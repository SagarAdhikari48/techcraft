<header class="app-header" role="banner">

  <div class="app-header__left">
    <button
      type="button"
      class="app-header__toggle"
      (click)="toggleSidebar.emit()"
      [attr.aria-label]="sidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      aria-controls="app-sidebar"
    >
      <i class="bi"
        [class.bi-layout-sidebar]="sidebarCollapsed()"
        [class.bi-layout-sidebar-inset]="!sidebarCollapsed()"
        aria-hidden="true">
      </i>
    </button>
    <h1 class="app-header__title">{{ getPageTitle() }}</h1>
  </div>

  <div class="app-header__right">
    @if (user()) {
      <div class="app-header__user-wrap">

        <button
          type="button"
          class="app-header__user-btn"
          (click)="toggleMenu()"
          [attr.aria-expanded]="menuOpen()"
          [attr.aria-label]="'User menu for ' + user()!.name"
          aria-haspopup="true"
        >
          <div class="app-header__avatar" aria-hidden="true">
            {{ user()!.name.charAt(0).toUpperCase() }}
          </div>
          <div class="app-header__user-info d-none d-md-flex">
            <span class="app-header__user-name">{{ user()!.name }}</span>
            <span class="app-header__user-role">{{ user()!.role }}</span>
          </div>
          <i class="bi bi-chevron-down app-header__chevron"
            [class.app-header__chevron--open]="menuOpen()"
            aria-hidden="true">
          </i>
        </button>

        @if (menuOpen()) {
          <div class="app-header__menu" role="menu" aria-label="User menu">
            <div class="app-header__menu-info">
              <small class="text-muted d-block">Signed in as</small>
              <strong class="d-block">{{ user()!.name }}</strong>
              <small class="text-muted">{{ user()!.email }}</small>
            </div>
            <hr class="my-2" />
            <button
              type="button"
              class="app-header__menu-item app-header__menu-item--danger"
              (click)="logout()"
              role="menuitem"
            >
              <i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>Sign out
            </button>
          </div>
        }

      </div>
    }
  </div>

</header>
